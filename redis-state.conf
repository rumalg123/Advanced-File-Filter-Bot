# PH-003: protected operational Redis, separate instance, separate memory policy.
# Never publish port 6379. The Compose state-network is internal-only.
# Authentication/TLS is recommended for non-Compose/external deployments.
bind 0.0.0.0
port 6379
# Bot connections arrive from another container on the private state-network.
# Unauthenticated protected mode rejects them. This default requires the
# internal Compose network and no published Redis port; use the ACL overlay
# when authentication is required. Do not use this config on a public network.
protected-mode no
daemonize no
loglevel notice
logfile ""
databases 1

# Unlike disposable search caches, operational state must never be evicted.
# If this limit is reached Redis rejects writes: monitor/alert and scale RAM.
maxmemory 256mb
maxmemory-policy noeviction

appendonly yes
appendfsync everysec
save 900 1
save 300 10
stop-writes-on-bgsave-error yes
dir /data

rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
