services:
  file-filter-bot:
    build: .
    container_name: file-filter-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # System Configuration
      - PYTHONPATH=/usr/src/app
      - REDIS_URI=redis://redis:6379/0
      # Optional, enable only after cutover/migration has been planned.
      - REDIS_STATE_URI=${REDIS_STATE_URI:-}
      - TZ=${TZ:-UTC}
      
      # Auto-Update Configuration
      - UPDATE_REPO=${UPDATE_REPO:-https://github.com/rumalg123/Advanced-File-Filter-Bot}
      - UPDATE_BRANCH=${UPDATE_BRANCH:-main}
      - AUTO_UPDATE=${AUTO_UPDATE:-false}
      - UPDATE_ON_START=${UPDATE_ON_START:-false}
      - BACKUP_ON_UPDATE=${BACKUP_ON_UPDATE:-true}
      
      # Performance Configuration
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-20}
      - CACHE_TTL=${CACHE_TTL:-3600}
      
      # Security Configuration
      - PUBLIC_FILE_STORE=${PUBLIC_FILE_STORE:-false}
    volumes:
      # Persistent data volumes
      - bot-backups:/usr/src/app/backups
      - bot-logs:/usr/src/app/logs
      - bot-data:/usr/src/app/data
      
      # Time synchronization
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bot-network
      - state-network
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:${PORT:-8000}/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.filefilterbot.service=bot"
      - "com.filefilterbot.auto-update=${AUTO_UPDATE:-false}"

  redis:
    image: redis:7-alpine
    container_name: file-filter-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    sysctls:
      - net.core.somaxconn=65535
    labels:
      - "com.filefilterbot.service=redis"

  # Opt-in protected state service. Start explicitly with:
  # docker compose --profile protected-state up -d redis-state
  # then set REDIS_STATE_URI=redis://redis-state:6379/0 for the bot.
  redis-state:
    profiles: ["protected-state"]
    image: redis:7-alpine
    container_name: file-filter-redis-state
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/state.conf
    volumes:
      - ./redis-state.conf:/usr/local/etc/redis/state.conf:ro
      - redis-state-data:/data
    networks:
      - state-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  redis-state-data:
    driver: local
  # Redis data volume
  redis-data:
    driver: local
    labels:
      - "com.filefilterbot.volume=redis-data"
      
  # Bot persistent data volumes
  bot-backups:
    driver: local
    labels:
      - "com.filefilterbot.volume=backups"
      
  bot-logs:
    driver: local
    labels:
      - "com.filefilterbot.volume=logs"
      
  bot-data:
    driver: local
    labels:
      - "com.filefilterbot.volume=data"

networks:
  state-network:
    driver: bridge
    internal: true
  bot-network:
    driver: bridge
    labels:
      - "com.filefilterbot.network=main"
