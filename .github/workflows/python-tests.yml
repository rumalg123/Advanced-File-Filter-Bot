name: Python regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# No privileged pull_request_target workflows or deployment steps here.
permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis-cache:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        # Ephemeral cache instance: allkeys-lru via runtime step below.
      redis-state:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # Tests explicitly reject non-local targets and never use deployed credentials.
      TEST_MONGO_URI: mongodb://127.0.0.1:27017
      TEST_REDIS_CACHE_URI: redis://127.0.0.1:6379/0
      TEST_REDIS_STATE_URI: redis://127.0.0.1:6380/0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Configure isolated Redis eviction policies
        # Using Docker container IDs from the job's own service containers.
        run: |
          docker exec "${{ job.services['redis-cache'].id }}" redis-cli CONFIG SET maxmemory 67108864
          docker exec "${{ job.services['redis-cache'].id }}" redis-cli CONFIG SET maxmemory-policy allkeys-lru
          docker exec "${{ job.services['redis-state'].id }}" redis-cli CONFIG SET maxmemory 67108864
          docker exec "${{ job.services['redis-state'].id }}" redis-cli CONFIG SET maxmemory-policy noeviction

      - name: Compile all Python source including scripts
        run: python -m compileall -q bot.py config core handlers repositories scripts tests

      - name: High-signal lint (undefined Python names)
        run: python -m ruff check --select F821,F822,F823 .

      - name: Full tests with coverage and real MongoDB and Redis
        run: >-
          python -m pytest -q
          --cov=core --cov=handlers --cov=repositories
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml

      - name: Upload coverage baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  container-preflight:
    name: container-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Compose without production secrets or deployments
        shell: bash
        run: |
          set -eu
          # Compose expects .env but these are inert CI-only placeholders.
          printf 'API_ID=1\nAPI_HASH=ci-placeholder\nBOT_TOKEN=123456:ci-placeholder\nDATABASE_URI=mongodb://127.0.0.1:27017/ci\n' > .env
          trap 'rm -f .env' EXIT
          docker compose --profile protected-state config --quiet

      - name: Validate opt-in Redis ACL overlay against local Redis
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_redis_acl.py
          trap 'docker rm -f ph010-ci-redis >/dev/null 2>&1 || true; rm -rf .secrets' EXIT
          docker compose -f docker-compose.yml -f docker-compose.redis-auth.yml \
            --profile protected-state config --quiet
          docker run -d --name ph010-ci-redis \
            -p 127.0.0.1:16379:6379 \
            --mount "type=bind,source=$PWD/redis.conf,target=/usr/local/etc/redis/redis.conf,readonly" \
            --mount "type=bind,source=$PWD/.secrets/redis-cache.acl,target=/run/secrets/redis_cache_acl,readonly" \
            --mount "type=bind,source=$PWD/.secrets/redis-cache.password,target=/run/secrets/redis_cache_password,readonly" \
            redis:7-alpine redis-server /usr/local/etc/redis/redis.conf \
              --aclfile /run/secrets/redis_cache_acl
          for i in $(seq 1 30); do
            if docker logs ph010-ci-redis 2>&1 | grep -q 'Ready to accept connections'; then
              break
            fi
            sleep 1
          done
          # The Redis service must reject clients without ACL authentication.
          docker exec ph010-ci-redis redis-cli ping | grep -q 'NOAUTH'
          # Correct credentials grant app operation (without printing secrets).
          docker exec ph010-ci-redis sh -c \
            'REDISCLI_AUTH="$(cat /run/secrets/redis_cache_password)" redis-cli --user filebot PING' \
            | grep -qx 'PONG'
          docker exec ph010-ci-redis sh -c \
            'REDISCLI_AUTH="$(cat /run/secrets/redis_cache_password)" redis-cli --user filebot SET ph010:ci yes' \
            | grep -qx 'OK'
          docker exec ph010-ci-redis sh -c \
            'REDISCLI_AUTH="$(cat /run/secrets/redis_cache_password)" redis-cli --user filebot GET ph010:ci' \
            | grep -qx 'yes'

      - name: Build production Dockerfile without deploying
        run: docker build --tag file-filter-bot:ci .

      - name: Assert container uses nonroot runtime and disabled updater
        shell: bash
        run: |
          set -eu
          test "$(docker image inspect --format '{{.Config.User}}' file-filter-bot:ci)" = "botuser"
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' file-filter-bot:ci | grep -qx 'AUTO_UPDATE=false'
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' file-filter-bot:ci | grep -qx 'UPDATE_ON_START=false'
